name: Market Data Sync

# Four schedules, ~1 hour apart, each running exactly one stage (instead of one
# long job with in-job `sleep`s — GitHub Actions bills sleep time the same as
# active compute, and this repo is private so minutes are no longer unlimited).
on:
  schedule:
    - cron: "0 22 * * *" # 06:00 Asia/Hong_Kong — US stocks
    - cron: "0 23 * * *" # 07:00 Asia/Hong_Kong — UK stocks
    - cron: "0 0 * * *"  # 08:00 Asia/Hong_Kong — HK stocks
    - cron: "0 1 * * *"  # 09:00 Asia/Hong_Kong — dividends + crypto + currency
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run manually (schedules pick this automatically)"
        type: choice
        options: [us, uk, hk, dividends]
        default: us

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Determine stage
        id: stage
        run: |
          if [ -n "${{ github.event.inputs.stage }}" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 22 * * *") echo "stage=us" >> "$GITHUB_OUTPUT" ;;
              "0 23 * * *") echo "stage=uk" >> "$GITHUB_OUTPUT" ;;
              "0 0 * * *")  echo "stage=hk" >> "$GITHUB_OUTPUT" ;;
              "0 1 * * *")  echo "stage=dividends" >> "$GITHUB_OUTPUT" ;;
              *) echo "stage=us" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      # Stock catalogs must run before dividen_fetcher.py, which reads
      # us_market.json / uk_market.json / hk_market.json to build its symbol
      # universe. Each market fetch commits and pushes its own file before the
      # next scheduled stage's job checks out, so dividends (an hour later)
      # sees all three.
      - name: Fetch US stocks
        if: steps.stage.outputs.stage == 'us'
        run: python3 scripts/stock-us.py

      - name: Fetch UK stocks
        if: steps.stage.outputs.stage == 'uk'
        run: python3 scripts/stock-uk.py

      - name: Fetch HK stocks
        if: steps.stage.outputs.stage == 'hk'
        run: python3 scripts/stock-hk.py

      - name: Fetch dividends
        if: steps.stage.outputs.stage == 'dividends'
        # Yahoo Finance rate-limits shared GitHub-hosted runner IPs, so a full
        # 11k+ symbol universe often can't complete in one run. dividen_fetcher.py
        # intentionally exits 2 (not a crash) when some symbols are still
        # retryable; --resume reuses its checkpoint so later runs fill the gaps,
        # and continue-on-error keeps crypto/currency/commit running regardless.
        continue-on-error: true
        run: python3 scripts/dividen_fetcher.py --resume

      - name: Fetch crypto
        if: steps.stage.outputs.stage == 'dividends'
        continue-on-error: true
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python3 scripts/crypto.py

      - name: Fetch currency rates
        if: steps.stage.outputs.stage == 'dividends'
        continue-on-error: true
        run: python3 scripts/currency.py

      # market_language.py has no CLI of its own; it is imported by the scripts above.

      - name: Commit and push generated data
        run: |
          set -euo pipefail
          git config user.name "livlogy-market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add MarketData/Generated
          if git diff --cached --quiet; then
            echo "No market data changes to publish."
            exit 0
          fi
          git commit -m "Update market data (${{ steps.stage.outputs.stage }}) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD
