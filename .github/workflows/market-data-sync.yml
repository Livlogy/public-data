name: Market Data Sync

# Three schedules, each timed to ~1 hour after that market's close, instead of
# one long job with in-job `sleep`s — GitHub Actions bills sleep time the same
# as active compute, and this repo is private so minutes are no longer unlimited.
on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Asia/Hong_Kong — UK stocks (~1hr after LSE close)
    - cron: "0 9 * * *"  # 17:00 Asia/Hong_Kong — HK stocks (~1hr after HKEX close)
    - cron: "0 22 * * *" # 06:00 Asia/Hong_Kong — US stocks (~1-2hr after NYSE/NASDAQ close) + dividends + crypto + currency
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage to run manually (schedules pick this automatically)"
        type: choice
        options: [us, uk, hk]
        default: us

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Determine stage
        id: stage
        run: |
          if [ -n "${{ github.event.inputs.stage }}" ]; then
            echo "stage=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 18 * * *") echo "stage=uk" >> "$GITHUB_OUTPUT" ;;
              "0 9 * * *")  echo "stage=hk" >> "$GITHUB_OUTPUT" ;;
              "0 22 * * *") echo "stage=us" >> "$GITHUB_OUTPUT" ;;
              *) echo "stage=us" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Fetch UK stocks
        if: steps.stage.outputs.stage == 'uk'
        run: python3 scripts/stock-uk.py

      - name: Fetch HK stocks
        if: steps.stage.outputs.stage == 'hk'
        run: python3 scripts/stock-hk.py

      # US stocks, dividends, crypto, and currency all run together in the
      # 'us' stage. dividen_fetcher.py reads us_market.json / uk_market.json /
      # hk_market.json, so US must fetch first here; UK/HK were already
      # committed by their own earlier stages and are present from checkout.
      - name: Fetch US stocks
        if: steps.stage.outputs.stage == 'us'
        run: python3 scripts/stock-us.py

      - name: Fetch dividends
        if: steps.stage.outputs.stage == 'us'
        # Yahoo Finance rate-limits shared GitHub-hosted runner IPs, so a full
        # 11k+ symbol universe often can't complete in one run. dividen_fetcher.py
        # intentionally exits 2 (not a crash) when some symbols are still
        # retryable; --resume reuses its checkpoint so later runs fill the gaps,
        # and continue-on-error keeps crypto/currency/commit running regardless.
        continue-on-error: true
        run: python3 scripts/dividen_fetcher.py --resume

      - name: Fetch crypto
        if: steps.stage.outputs.stage == 'us'
        continue-on-error: true
        env:
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
        run: python3 scripts/crypto.py

      - name: Fetch currency rates
        if: steps.stage.outputs.stage == 'us'
        continue-on-error: true
        run: python3 scripts/currency.py

      # market_language.py has no CLI of its own; it is imported by the scripts above.

      - name: Commit and push generated data
        run: |
          set -euo pipefail
          git config user.name "livlogy-market-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add MarketData/Generated
          if git diff --cached --quiet; then
            echo "No market data changes to publish."
            exit 0
          fi
          git commit -m "Update market data (${{ steps.stage.outputs.stage }}) $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD
